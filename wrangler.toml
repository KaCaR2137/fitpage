# Konfiguracja Workera (dodana 23.09.2026, wcześniej projekt nie miał
# żadnego commitowanego wrangler.toml — cała konfiguracja żyła w
# dashboardzie Cloudflare jako "Workers Builds" z domyślnym "Deploy
# command: npx wrangler deploy", serwująca cały root repo jako statyczne
# assety bez własnego kodu. Ten plik wprowadza pierwszy prawdziwy handler
# (POST /api/potwierdz-kontakt), więc `wrangler deploy` potrzebuje już
# jawnej konfiguracji zamiast domyślnej, dotychczasowej syntezowanej przez
# Cloudflare automatycznie.
#
# WAŻNE PRZED PIERWSZYM DEPLOYEM: `name` niżej MUSI zgadzać się z nazwą
# istniejącego Workera widoczną w dashboardzie (Workers & Pages → fitpage →
# Settings → General). Wywnioskowane z adresu fallback
# fitpage.kacperbarczak11.workers.dev (wzorzec <nazwa>.<subdomena
# konta>.workers.dev) jako "fitpage" — zweryfikuj to jednym spojrzeniem w
# dashboardzie, zanim wypchniesz. Błędna nazwa może wdrożyć się jako osobny,
# nowy Worker zamiast zaktualizować istniejący.

name = "fitpage"
main = "src/worker.js"
compatibility_date = "2026-09-23"

# Statyczne assety — cały root repo, dokładnie tak jak dotąd (patrz
# .assetsignore w korzeniu repo, który i tak ukrywa wszystko poza jawnie
# odsłoniętymi plikami strony). html_handling ustawiony jawnie na wartość,
# która odpowiada zaobserwowanemu, już żywemu zachowaniu (np.
# fitpage.pl/kontakt.html przekierowuje na fitpage.pl/kontakt) — nie
# zostawiony na domyślny, żeby ten plik nie mógł go po cichu zmienić.
[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# Bez tego API tras /api/* i tak działałoby poprawnie (domyślne
# zachowanie: assets sprawdzane jako pierwsze, Worker jako fallback dla
# ścieżek bez pasującego pliku — /api/potwierdz-kontakt nigdy nie ma
# pasującego pliku). run_worker_first wymusza to jawnie i tylko dla
# /api/* — reszta strony nadal trafia najpierw do assets, bez zmiany
# zachowania. Zabezpiecza też na przyszłość: gdyby kiedyś powstał
# przypadkiem plik pod /api/..., nie przesłoniłby cicho tej trasy.
run_worker_first = ["/api/*"]

# Limit żądań per IP na /api/potwierdz-kontakt (sprawdzone empirycznie:
# ten wzorzec TOML poprawnie parsuje się w wrangler 4.137.0). namespace_id
# to dowolna, samodzielnie wybrana liczba, nie coś do pobrania skądś —
# służy tylko do odróżnienia tego licznika od innych, gdyby kiedyś doszedł
# drugi rate-limited endpoint. 5 żądań/60s na IP: swobodnie starcza na
# prawdziwe zgłoszenie (nawet z przypadkowym podwójnym kliknięciem), za
# mało na spam relay. Dostosuj `limit`/`period` w jednym miejscu, jeśli
# okaże się za ciasne albo za luźne w praktyce.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
